# Every value here comes from the environment, and none has a fallback: a
# missing variable must fail the container, not quietly start it against the
# wrong backend. EnvironmentValidator checks the same list before Spring boots
# so the failure is one readable line rather than a placeholder stack trace.

server.port=${SERVER_PORT}

# DB_HOST is the RDS Proxy endpoint. The instance endpoint is not reachable
# from the app subnets - the instance security group admits the proxy only.
# sslmode=require because the proxy is created with RequireTLS: true. It
# encrypts but does not verify the server certificate; production ships the RDS
# CA bundle in the image and uses verify-full.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Small pool per task. The proxy is what multiplexes these onto the handful of
# connections a db.t3.micro can actually carry, which is why it exists.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Start even if the database is briefly unreachable. Combined with a /health
# endpoint that checks nothing external, a DB blip during a deploy does not
# cascade into the ALB killing every task.
spring.datasource.hikari.initialization-fail-timeout=-1

# Fine for a lab with one table. Production uses Flyway or Liquibase so schema
# changes are reviewed, ordered and reversible.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ElastiCache with encryption in transit and an AUTH token, both non-negotiable
# on the replication group.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_AUTH_TOKEN}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

app.cache.ttl-seconds=${CACHE_TTL_SECONDS:60}

spring.jackson.serialization.write-dates-as-timestamps=false
