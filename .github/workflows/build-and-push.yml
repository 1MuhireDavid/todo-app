name: Build and push

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/build-and-push.yml"

concurrency:
  group: build-and-push
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::047719661196:role/todo-app-gha-app-build
  ECR_REPOSITORY: todo-app
  DEPLOY_TAG: latest

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: build-and-push-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          sha_tag="sha-$(git rev-parse --short=12 HEAD)"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          docker build \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:${sha_tag}" \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_TAG}" \
            .

      # The sha tag triggers nothing and is what a rollback re-tags from. The
      # EventBridge rule fires on the latest push, which starts the pipeline.
      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          set -euo pipefail
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${SHA_TAG}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_TAG}"
