# CodeDeploy blue/green specification for the ECS service.
#
# <TASK_DEFINITION> is a CodeDeploy placeholder: CodePipeline registers the
# revision built from taskdef.json and substitutes its ARN here. Leave it
# literal.
#
# ContainerName must match the container name in taskdef.json and the
# ContainerName the ECS service was created with in 06-alb-ecs.yaml, which is
# the ProjectName. If you rename the project, rename it in all three places.

version: 0.0

Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: <TASK_DEFINITION>
        LoadBalancerInfo:
          ContainerName: todo-app
          ContainerPort: 8080
        PlatformVersion: LATEST
